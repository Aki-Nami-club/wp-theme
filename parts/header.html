<!-- wp:group {"className":"vibemag-header"} -->
<div class="wp-block-group vibemag-header">
  <!-- wp:group {"className":"vibemag-header__ticker","layout":{"type":"constrained"}} -->
  <div class="wp-block-group vibemag-header__ticker">
    <!-- wp:paragraph {"className":"vibemag-header__ticker-label"} -->
    <p class="vibemag-header__ticker-label" data-i18n-text="latestLabel">Latest:</p>
    <!-- /wp:paragraph -->

    <!-- wp:shortcode -->
    [vibemag_news_ticker]
    <!-- /wp:shortcode -->
  </div>
  <!-- /wp:group -->

  <!-- wp:group {"className":"vibemag-header__branding","layout":{"type":"flex","justifyContent":"space-between","verticalAlignment":"center","flexWrap":"nowrap"}} -->
  <div class="wp-block-group vibemag-header__branding">
    <!-- wp:site-logo {"width":180} /-->

    <!-- wp:shortcode -->
    [vibemag_ad_image slot="header"]
    <!-- /wp:shortcode -->
  </div>
  <!-- /wp:group -->

  <!-- wp:group {"className":"vibemag-header__nav is-sticky","layout":{"type":"flex","justifyContent":"space-between","verticalAlignment":"center"}} -->
  <div class="wp-block-group vibemag-header__nav is-sticky">
    <!-- wp:navigation {"layout":{"type":"flex","justifyContent":"left"}} /-->

    <!-- wp:html -->
    <div class="vibemag-search" data-search-root>
      <button type="button" class="vibemag-theme-toggle" data-theme-toggle aria-label="Toggle dark mode" data-i18n-aria-label="toggleDarkMode">🌙</button>
      <button type="button" class="vibemag-search__toggle" data-search-open aria-label="Open search" data-i18n-aria-label="openSearch">🔍</button>

      <div class="vibemag-search__overlay" data-search-overlay>
        <div class="vibemag-search__panel">
          <div class="vibemag-search__bar">
            <input type="search" placeholder="Search posts..." data-i18n-placeholder="searchPlaceholder" data-search-input />
            <button type="button" data-search-close data-i18n-aria-label="closeSearch" aria-label="Close search">✕</button>
          </div>

          <p data-search-loading data-i18n-text="searching" hidden>Searching...</p>
          <ul class="vibemag-search__results" data-search-results hidden></ul>
          <p data-search-empty data-i18n-text="noResults" hidden>No results found.</p>
        </div>
      </div>
    </div>
    <!-- /wp:html -->
  </div>
  <!-- /wp:group -->
</div>
<!-- /wp:group -->
